# Optional local services, for developers who don't use MongoDB Atlas. Data persists in the
# mongodata volume. MongoDB runs as a one-node replica set because transactions need one.
name: videobridge-dev
services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it has a primary.
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\" | grep -q 1"]
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
volumes: { mongodata: {} }
