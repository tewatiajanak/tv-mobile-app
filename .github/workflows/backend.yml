name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "infra/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: mongodb://localhost:57017/videobridge_test?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://localhost:56379/0
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB (one-node replica set)
        working-directory: .
        run: docker compose -f infra/docker-compose.test.yml up -d --wait mongo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma db push
      - run: npm run test:e2e
      - name: OpenAPI is up to date
        run: npm run openapi:export && git diff --exit-code -- ../docs/api/openapi.json
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: |
            backend/coverage
            backend/junit*.xml
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t videobridge-backend:ci backend
